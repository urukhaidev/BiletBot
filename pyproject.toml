[project]
name = "biletbot"
version = "0.1.0"
description = "Telegram flight search and persistent price monitoring"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=21.0,<23", "httpx[socks]>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fastapi>=0.115,<1"]
mini-app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["biletbot*"]

[tool.setuptools.package-data]
biletbot = ["fonts/*.ttf", "fonts/*OFL.txt", "assets/*.png", "assets/LICENSE-GRAPHICS"]
